version: '3.8'

services:
  postgres:
    image: postgres:14
    container_name: gestordefrota-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gestordefrota-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestordefrota-backend
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gestordefrota-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestordefrota-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gestordefrota-network

networks:
  gestordefrota-network:
    driver: bridge

volumes:
  postgres-data:
