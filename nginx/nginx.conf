# Bloco HTTP (porta 80)
server {
    listen 80;
    server_name fivecoresolutions.com www.fivecoresolutions.com;  # Substitua pelo seu domínio

    # Redireciona todas as requisições HTTP para HTTPS
    return 301 https://$host$request_uri;
}

# Bloco HTTPS (porta 443)
server {
    listen 443 ssl http2;
    server_name fivecoresolutions.com www.fivecoresolutions.com;  # Substitua pelo seu domínio

    # Certificados SSL (Let's Encrypt ou outros)
    ssl_certificate /etc/letsencrypt/live/fivecoresolutions.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fivecoresolutions.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Ativa HSTS (Strict Transport Security) para forçar o HTTPS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Configuração para o Frontend (Next.js)
    location / {
        proxy_pass http://frontend_prod:3000;  # Nome do serviço no docker-compose.prod.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuração para o Backend (NestJS API)
    location /api/ {
        # Remove /api do path antes de passar para o backend
        rewrite ^/api/(.*)$ /$1 break;

        proxy_pass http://backend_prod:3001;  # Nome do serviço no docker-compose.prod.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional: Configurações adicionais de log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Limites de tamanho de upload
    client_max_body_size 10M;
}
