server {
    listen 80;
    server_name seu_dominio.com www.seu_dominio.com; # Substitua pelo seu domínio

    # Configuração para o Frontend (Next.js)
    location / {
        proxy_pass http://frontend_prod:3000; # Nome do serviço no docker-compose.prod.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Configuração para o Backend (NestJS API)
    location /api/ {
        # Remove /api do path antes de passar para o backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://backend_prod:3001; # Nome do serviço no docker-compose.prod.yml
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Opcional: Configurações adicionais (logs, limites, etc.)
    # access_log /var/log/nginx/access.log;
    # error_log /var/log/nginx/error.log;
    # client_max_body_size 10M;
}

# Descomente e configure este bloco se for usar HTTPS com Certbot/Let's Encrypt
server {
   listen 443 ssl http2;
   server_name seu_dominio.com www.seu_dominio.com;

   ssl_certificate /etc/letsencrypt/live/seu_dominio.com/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/seu_dominio.com/privkey.pem;
   include /etc/letsencrypt/options-ssl-nginx.conf;
   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

   location / { ... } # Repetir configurações do location / do bloco HTTP
   location /api/ { ... } # Repetir configurações do location /api/ do bloco HTTP
}

