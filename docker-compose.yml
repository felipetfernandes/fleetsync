services:
  mysql:
    image: mysql:8.0
    container_name: gestordefrota-mysql
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gestordefrota-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gestordefrota-backend
    restart: always
    ports:
      - "3001:3001"
      - "5555:5555"
    depends_on:
      - mysql
    environment:
      - DATABASE_URL=mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=3001
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - gestordefrota-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gestordefrota-frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - gestordefrota-network

networks:
  gestordefrota-network:
    driver: bridge

volumes:
  mysql-data:
